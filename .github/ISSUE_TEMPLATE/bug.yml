name: Bug
description: Something doesn't work.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Vulns go to [Security](https://github.com/eric-huychung/skil/security/advisories/new), not here.
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - CLI
        - macOS app
        - Website
        - Docs
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Tag (0.8.0), git SHA, or "from source".
      placeholder: 0.8.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15, Ubuntu 24.04, …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste output if you have it.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      description: [CODE_OF_CONDUCT.md](https://github.com/eric-huychung/skil/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
