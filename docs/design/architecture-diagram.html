<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>skil Architecture</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 1100px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 18px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 11px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1.5;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .seam {
    stroke: #10b981;
    stroke-width: 2;
    stroke-dasharray: 4 3;
    fill: none;
  }
</style>
<main>
  <svg viewBox="0 0 1100 780" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="var(--line)" />
      </marker>
    </defs>

    <text x="550" y="32" text-anchor="middle" class="title">skil: engine, adapters, one state.json</text>

    <rect x="24" y="52" width="220" height="88" rx="4" class="node neutral" />
    <text x="36" y="74" class="small" font-weight="600">Legend</text>
    <rect x="36" y="86" width="18" height="12" class="node process" />
    <text x="60" y="96" class="small">Deep module</text>
    <rect x="36" y="106" width="18" height="12" class="node input" />
    <text x="60" y="116" class="small">Adapter</text>
    <rect x="140" y="86" width="18" height="12" class="node storage" />
    <text x="164" y="96" class="small">State</text>
    <rect x="140" y="106" width="18" height="12" class="node external" />
    <text x="164" y="116" class="small">Disk / npx</text>

    <path d="M 150 248 L 150 268 L 220 300" class="edge" marker-end="url(#arrow)" />
    <path d="M 390 248 L 390 268 L 340 300" class="edge" marker-end="url(#arrow)" />
    <path d="M 200 428 L 140 488" class="edge" marker-end="url(#arrow)" />
    <path d="M 290 428 L 350 488" class="edge" marker-end="url(#arrow)" />
    <path d="M 380 428 L 480 428 L 560 488" class="edge" marker-end="url(#arrow)" />
    <path d="M 140 582 L 125 640" class="edge" marker-end="url(#arrow)" />
    <path d="M 350 582 L 350 640" class="edge" marker-end="url(#arrow)" />
    <path d="M 560 582 L 470 640" class="edge" marker-end="url(#arrow)" />
    <path d="M 560 582 L 640 640" class="edge" marker-end="url(#arrow)" />
    <path d="M 430 360 L 720 348" class="edge" marker-end="url(#arrow)" />
    <path d="M 430 390 L 720 500" class="edge" marker-end="url(#arrow)" />

    <rect x="50" y="168" width="200" height="80" rx="4" class="node neutral" />
    <text x="150" y="200" text-anchor="middle" class="label">CLI</text>
    <text x="150" y="220" text-anchor="middle" class="small">scan · list · copy</text>
    <text x="150" y="236" text-anchor="middle" class="small">install / export --to &lt;dock&gt;</text>

    <rect x="290" y="168" width="200" height="80" rx="4" class="node neutral" />
    <text x="390" y="200" text-anchor="middle" class="label">GUI</text>
    <text x="390" y="220" text-anchor="middle" class="small">one Commands list</text>
    <text x="390" y="236" text-anchor="middle" class="small">Install/Export/Copy pick dock</text>

    <line x1="30" y1="268" x2="510" y2="268" class="seam" />
    <text x="30" y="286" class="small" fill="#10b981" font-weight="600">Seam: CLI / GUI call engine only</text>

    <rect x="150" y="300" width="280" height="128" rx="4" class="node process" />
    <text x="290" y="332" text-anchor="middle" class="label">CollectionEngine</text>
    <text x="290" y="352" text-anchor="middle" class="small">scan · list · file (no dock)</text>
    <text x="290" y="368" text-anchor="middle" class="small">copyTo · install · export</text>
    <text x="290" y="392" text-anchor="middle" class="small">catalog · inbox · one command list</text>
    <text x="290" y="408" text-anchor="middle" class="small">stamps · gone ids · write-through</text>

    <line x1="130" y1="448" x2="450" y2="448" class="seam" />
    <text x="130" y="466" class="small" fill="#10b981" font-weight="600">Seam: mock adapters in engine tests</text>

    <rect x="50" y="488" width="180" height="94" rx="4" class="node input" />
    <text x="140" y="518" text-anchor="middle" class="label">FileSystemAdapter</text>
    <text x="140" y="538" text-anchor="middle" class="small">JSON · walk SKILL.md</text>
    <text x="140" y="554" text-anchor="middle" class="small">read / write / copyDir</text>
    <text x="140" y="570" text-anchor="middle" class="small">real + memfs</text>

    <rect x="260" y="488" width="180" height="94" rx="4" class="node input" />
    <text x="350" y="518" text-anchor="middle" class="label">DiskWatch</text>
    <text x="350" y="538" text-anchor="middle" class="small">debounce 500ms</text>
    <text x="350" y="554" text-anchor="middle" class="small">mute writes 1s</text>
    <text x="350" y="570" text-anchor="middle" class="small">skip .git</text>

    <rect x="470" y="488" width="180" height="94" rx="4" class="node input" />
    <text x="560" y="518" text-anchor="middle" class="label">SkillsAdapter</text>
    <text x="560" y="538" text-anchor="middle" class="small">search / browse</text>
    <text x="560" y="554" text-anchor="middle" class="small">npx skills add</text>
    <text x="560" y="570" text-anchor="middle" class="small">nock + in-memory</text>

    <line x1="30" y1="602" x2="670" y2="602" class="seam" />
    <text x="30" y="620" class="small" fill="#10b981" font-weight="600">Seam: adapter tests mock FS / HTTP / subprocess</text>

    <rect x="50" y="640" width="150" height="60" rx="4" class="node external" />
    <text x="125" y="666" text-anchor="middle" class="label">IDE trees</text>
    <text x="125" y="684" text-anchor="middle" class="small">skills + stamped cmds</text>

    <rect x="270" y="640" width="160" height="60" rx="4" class="node external" />
    <text x="350" y="666" text-anchor="middle" class="label">fs events</text>
    <text x="350" y="684" text-anchor="middle" class="small">four skills + cmd dirs</text>

    <rect x="450" y="640" width="120" height="60" rx="4" class="node external" />
    <text x="510" y="666" text-anchor="middle" class="label">skills.sh</text>
    <text x="510" y="684" text-anchor="middle" class="small">OIDC proxy</text>

    <rect x="580" y="640" width="120" height="60" rx="4" class="node external" />
    <text x="640" y="666" text-anchor="middle" class="label">npx skills</text>
    <text x="640" y="684" text-anchor="middle" class="small">--agent inside adapter</text>

    <rect x="720" y="300" width="340" height="96" rx="4" class="node storage" />
    <text x="890" y="332" text-anchor="middle" class="label">.skil/state.json</text>
    <text x="890" y="352" text-anchor="middle" class="small">inbox[]  ·  skills[]  (one catalog)</text>
    <text x="890" y="370" text-anchor="middle" class="small">commands[].skills  (one list, v6)</text>
    <text x="890" y="388" text-anchor="middle" class="small">no per-dock state file</text>

    <rect x="720" y="452" width="340" height="248" rx="4" class="node neutral" />
    <text x="890" y="484" text-anchor="middle" class="label">Depth rules</text>
    <text x="744" y="512" class="small">Mutate verbs skip dock. They get { name, skills }.</text>
    <text x="744" y="530" class="small">The one command list stays inside the engine.</text>
    <text x="744" y="556" class="small">Write-through: rewrites stamps already on a dock.</text>
    <text x="744" y="574" class="small">Copy / Export push to another dock.</text>
    <text x="744" y="600" class="small">Stamped mismatch just warns (commandPulls).</text>
    <text x="744" y="618" class="small">No adopt into map. No silent merge.</text>
    <text x="744" y="644" class="small">Inbox and catalog stay global.</text>
    <text x="744" y="662" class="small">Watcher calls scan, not a 3-way merge.</text>
  </svg>
</main>
