<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ContextKit Architecture</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 1200px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 18px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 11px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 2;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
  .seam {
    stroke: #10b981;
    stroke-width: 2;
    stroke-dasharray: 4 3;
    fill: none;
  }
</style>
<main>
  <svg viewBox="0 0 1100 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="var(--line)" />
      </marker>
    </defs>

    <!-- Title -->
    <text x="550" y="30" text-anchor="middle" class="title">ContextKit Architecture: Deep Modules with Test Seams</text>

    <!-- Legend -->
    <rect x="20" y="50" width="180" height="100" rx="4" class="node neutral" />
    <text x="30" y="70" class="small" font-weight="600">Legend:</text>
    <rect x="30" y="80" width="20" height="15" class="node process" />
    <text x="55" y="92" class="small">Deep Module (business logic)</text>
    <rect x="30" y="100" width="20" height="15" class="node input" />
    <text x="55" y="112" class="small">Adapter (wrapper)</text>
    <rect x="30" y="120" width="20" height="15" class="node neutral" />
    <text x="55" y="132" class="small">Thin UI (routing)</text>

    <!-- UI Layer (Thin Interfaces) -->
    <rect x="50" y="180" width="200" height="80" rx="4" class="node neutral" />
    <text x="150" y="210" text-anchor="middle" class="label">CLI</text>
    <text x="150" y="230" text-anchor="middle" class="small">Command parsing</text>
    <text x="150" y="245" text-anchor="middle" class="small">Output formatting</text>

    <rect x="280" y="180" width="200" height="80" rx="4" class="node neutral" />
    <text x="380" y="210" text-anchor="middle" class="label">GUI (Electron)</text>
    <text x="380" y="230" text-anchor="middle" class="small">React components</text>
    <text x="380" y="245" text-anchor="middle" class="small">Event handlers</text>

    <!-- Test seam line -->
    <line x1="30" y1="280" x2="500" y2="280" class="seam" />
    <text x="30" y="298" class="small" fill="#10b981" font-weight="600">Test Seam: Integration tests (mocked adapters)</text>

    <!-- Core Engine (Deep Module) -->
    <rect x="150" y="320" width="280" height="120" rx="4" class="node process" />
    <text x="290" y="350" text-anchor="middle" class="label">CollectionEngine</text>
    <text x="290" y="370" text-anchor="middle" class="small">(DEEP MODULE)</text>
    <text x="290" y="390" text-anchor="middle" class="small">create | activate | deactivate | list | status</text>
    <text x="290" y="410" text-anchor="middle" class="small">State management, validation, coordination</text>
    <text x="290" y="425" text-anchor="middle" class="small">Multi-IDE support, conflict detection</text>

    <!-- Arrows from UI to Engine -->
    <path d="M 150 260 L 150 280 L 200 320" class="edge" marker-end="url(#arrow)" />
    <path d="M 380 260 L 380 280 L 340 320" class="edge" marker-end="url(#arrow)" />

    <!-- Test seam line around engine -->
    <line x1="130" y1="460" x2="450" y2="460" class="seam" />
    <text x="130" y="478" class="small" fill="#10b981" font-weight="600">Test Seam: Unit tests (primary seam - mock all adapters)</text>

    <!-- Adapter Layer -->
    <rect x="50" y="500" width="180" height="90" rx="4" class="node input" />
    <text x="140" y="530" text-anchor="middle" class="label">FileSystemAdapter</text>
    <text x="140" y="550" text-anchor="middle" class="small">createSymlink</text>
    <text x="140" y="565" text-anchor="middle" class="small">detectIDEs</text>
    <text x="140" y="580" text-anchor="middle" class="small">readJSON | writeJSON</text>

    <rect x="260" y="500" width="180" height="90" rx="4" class="node input" />
    <text x="350" y="530" text-anchor="middle" class="label">ConfigAdapter</text>
    <text x="350" y="550" text-anchor="middle" class="small">read | write</text>
    <text x="350" y="565" text-anchor="middle" class="small">validate</text>
    <text x="350" y="580" text-anchor="middle" class="small">YAML parsing</text>

    <rect x="470" y="500" width="180" height="90" rx="4" class="node input" />
    <text x="560" y="530" text-anchor="middle" class="label">SkillsAdapter</text>
    <text x="560" y="550" text-anchor="middle" class="small">search | install</text>
    <text x="560" y="565" text-anchor="middle" class="small">convert | getInstalled</text>
    <text x="560" y="580" text-anchor="middle" class="small">External tool wrapping</text>

    <!-- Arrows from Engine to Adapters -->
    <path d="M 200 440 L 140 500" class="edge" marker-end="url(#arrow)" />
    <path d="M 290 440 L 350 500" class="edge" marker-end="url(#arrow)" />
    <path d="M 380 440 L 480 440 L 560 500" class="edge" marker-end="url(#arrow)" />

    <!-- Test seam line -->
    <line x1="30" y1="610" x2="670" y2="610" class="seam" />
    <text x="30" y="628" class="small" fill="#10b981" font-weight="600">Test Seam: Adapter tests (mock external systems)</text>

    <!-- External Systems Layer -->
    <rect x="50" y="650" width="150" height="60" rx="4" class="node external" />
    <text x="125" y="675" text-anchor="middle" class="label">File System</text>
    <text x="125" y="695" text-anchor="middle" class="small">Symlinks, JSON files</text>

    <rect x="230" y="650" width="150" height="60" rx="4" class="node external" />
    <text x="305" y="675" text-anchor="middle" class="label">.contextkit.yml</text>
    <text x="305" y="695" text-anchor="middle" class="small">Config file</text>

    <rect x="410" y="650" width="120" height="60" rx="4" class="node external" />
    <text x="470" y="675" text-anchor="middle" class="label">skills.sh API</text>
    <text x="470" y="695" text-anchor="middle" class="small">HTTP</text>

    <rect x="560" y="650" width="120" height="60" rx="4" class="node external" />
    <text x="620" y="675" text-anchor="middle" class="label">npx skills</text>
    <text x="620" y="695" text-anchor="middle" class="small">Subprocess</text>

    <!-- Arrows from Adapters to External -->
    <path d="M 140 590 L 125 650" class="edge" marker-end="url(#arrow)" />
    <path d="M 350 590 L 305 650" class="edge" marker-end="url(#arrow)" />
    <path d="M 560 590 L 470 650" class="edge" marker-end="url(#arrow)" />
    <path d="M 560 590 L 620 650" class="edge" marker-end="url(#arrow)" />

    <!-- State Storage -->
    <rect x="730" y="320" width="180" height="80" rx="4" class="node storage" />
    <text x="820" y="350" text-anchor="middle" class="label">State (.contextkit/)</text>
    <text x="820" y="370" text-anchor="middle" class="small">state.json</text>
    <text x="820" y="385" text-anchor="middle" class="small">Single source of truth</text>

    <!-- Arrow from Engine to State -->
    <path d="M 430 380 L 730 360" class="edge" marker-end="url(#arrow)" />
    <text x="550" y="365" class="small">read/write</text>

    <!-- Design Principles Box -->
    <rect x="730" y="440" width="340" height="280" rx="4" class="node neutral" opacity="0.3" />
    <text x="900" y="470" text-anchor="middle" class="label">Design Principles</text>
    
    <text x="750" y="495" class="small" font-weight="600">Depth:</text>
    <text x="750" y="512" class="small">• CollectionEngine = small interface + rich logic</text>
    <text x="750" y="527" class="small">• 5 methods serve CLI, GUI, and all tests</text>
    
    <text x="750" y="552" class="small" font-weight="600">Testability:</text>
    <text x="750" y="569" class="small">• Test at seams (green lines), not internals</text>
    <text x="750" y="584" class="small">• Accept dependencies, don't create them</text>
    <text x="750" y="599" class="small">• Adapters are mocked in engine tests</text>
    
    <text x="750" y="624" class="small" font-weight="600">Leverage:</text>
    <text x="750" y="641" class="small">• One engine implementation → N callers</text>
    <text x="750" y="656" class="small">• Change state format? Only engine affected</text>
    <text x="750" y="671" class="small">• Add IDE? Only FileSystemAdapter touched</text>
    
    <text x="750" y="696" class="small" font-weight="600">Locality:</text>
    <text x="750" y="713" class="small">• Validation logic concentrated in engine</text>

    <!-- Data Flow Annotation -->
    <text x="50" y="755" class="small" fill="var(--muted)" font-weight="600">Data Flow: User → UI → Engine → Adapters → External Systems</text>
    <text x="50" y="775" class="small" fill="var(--muted)">Tests inject mocks at adapter boundaries; engine never touches file system directly</text>
  </svg>
</main>
