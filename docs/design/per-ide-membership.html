<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>skil per-IDE membership</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 1100px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 18px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 11px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1.5;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
</style>
<main>
  <svg viewBox="0 0 1100 640" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="var(--line)" />
      </marker>
    </defs>

    <text x="550" y="32" text-anchor="middle" class="title">One catalog · per-IDE command lists · light watcher</text>

    <path d="M 200 168 L 200 200" class="edge" marker-end="url(#arrow2)" />
    <path d="M 550 128 L 550 200" class="edge" marker-end="url(#arrow2)" />
    <path d="M 200 312 L 200 360" class="edge" marker-end="url(#arrow2)" />
    <path d="M 160 456 L 160 504" class="edge" marker-end="url(#arrow2)" />
    <path d="M 390 456 L 390 504" class="edge" marker-end="url(#arrow2)" />
    <path d="M 620 456 L 620 504" class="edge" marker-end="url(#arrow2)" />
    <path d="M 850 456 L 850 504" class="edge" marker-end="url(#arrow2)" />
    <path d="M 550 312 L 550 360" class="edge" marker-end="url(#arrow2)" />
    <path d="M 720 248 L 900 248" class="edge" marker-end="url(#arrow2)" />
    <path d="M 900 288 L 900 504" class="edge" marker-end="url(#arrow2)" />
    <path d="M 390 168 L 200 200" class="edge" marker-end="url(#arrow2)" />

    <rect x="40" y="56" width="320" height="112" rx="4" class="node input" />
    <text x="200" y="88" text-anchor="middle" class="label">Inbox (global)</text>
    <text x="200" y="112" text-anchor="middle" class="small">scan adds · Discover Add</text>
    <text x="200" y="130" text-anchor="middle" class="small">file does not drop the id</text>
    <text x="200" y="148" text-anchor="middle" class="small">not per IDE</text>

    <rect x="400" y="56" width="300" height="72" rx="4" class="node input" />
    <text x="550" y="88" text-anchor="middle" class="label">skills[] catalog</text>
    <text x="550" y="108" text-anchor="middle" class="small">one row · many paths / deployedTo</text>

    <rect x="40" y="200" width="680" height="112" rx="4" class="node process" />
    <text x="380" y="232" text-anchor="middle" class="label">/build membership (M:N)</text>
    <text x="380" y="256" text-anchor="middle" class="small">Cursor [tdd, design]     Claude [tdd]     Windsurf · Agents empty until Copy</text>
    <text x="380" y="280" text-anchor="middle" class="small">list(ide) returns { name, skills } for that IDE only</text>
    <text x="380" y="300" text-anchor="middle" class="small">file on Cursor does not rewrite Claude</text>

    <rect x="760" y="200" width="300" height="96" rx="4" class="node storage" />
    <text x="910" y="232" text-anchor="middle" class="label">.skil/state.json</text>
    <text x="910" y="254" text-anchor="middle" class="small">schema v5 · one file</text>
    <text x="910" y="272" text-anchor="middle" class="small">no .cursor/.skil/state.json</text>

    <rect x="40" y="360" width="240" height="96" rx="4" class="node external" />
    <text x="160" y="392" text-anchor="middle" class="label">Cursor</text>
    <text x="160" y="414" text-anchor="middle" class="small">.cursor/skills</text>
    <text x="160" y="432" text-anchor="middle" class="small">.cursor/commands/*.md</text>

    <rect x="300" y="360" width="180" height="96" rx="4" class="node external" />
    <text x="390" y="392" text-anchor="middle" class="label">Claude</text>
    <text x="390" y="414" text-anchor="middle" class="small">.claude/skills</text>
    <text x="390" y="432" text-anchor="middle" class="small">.claude/commands</text>

    <rect x="500" y="360" width="240" height="96" rx="4" class="node external" />
    <text x="620" y="392" text-anchor="middle" class="label">Windsurf</text>
    <text x="620" y="414" text-anchor="middle" class="small">.windsurf/skills</text>
    <text x="620" y="432" text-anchor="middle" class="small">.windsurf/workflows</text>

    <rect x="760" y="360" width="180" height="96" rx="4" class="node external" />
    <text x="850" y="392" text-anchor="middle" class="label">Agents</text>
    <text x="850" y="414" text-anchor="middle" class="small">.agents/skills</text>
    <text x="850" y="432" text-anchor="middle" class="small">.agents/commands</text>

    <rect x="40" y="504" width="240" height="88" rx="4" class="node process" />
    <text x="160" y="536" text-anchor="middle" class="label">Write-through</text>
    <text x="160" y="556" text-anchor="middle" class="small">Cursor edit → Cursor stamps</text>
    <text x="160" y="574" text-anchor="middle" class="small">others wait for Copy</text>

    <rect x="300" y="504" width="320" height="88" rx="4" class="node process" />
    <text x="460" y="536" text-anchor="middle" class="label">Copy to Claude</text>
    <text x="460" y="556" text-anchor="middle" class="small">membership + stamped file</text>
    <text x="460" y="574" text-anchor="middle" class="small">+ missing skill folders</text>

    <rect x="640" y="504" width="420" height="88" rx="4" class="node input" />
    <text x="850" y="536" text-anchor="middle" class="label">Watcher → scan</text>
    <text x="850" y="556" text-anchor="middle" class="small">debounce 500ms · mute our writes 1s · skip .git</text>
    <text x="850" y="574" text-anchor="middle" class="small">stamped file wins that IDE only · not a live merge</text>
  </svg>
</main>
